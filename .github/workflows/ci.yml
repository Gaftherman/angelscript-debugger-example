name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Build (${{ matrix.name }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { name: windows x64, os: windows-latest }
          - { name: linux x64, os: ubuntu-24.04 }
          - { name: macos arm64, os: macos-latest }
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ninja
      - uses: ilammy/msvc-dev-cmd@v1
        if: runner.os == 'Windows'
      - name: Configure
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release -DASDEBUGGER_BUILD_TESTS=ON
      - name: Build
        run: cmake --build build --parallel 4
      - name: Core tests
        run: ctest --test-dir build --output-on-failure
      - name: DAP attach test
        shell: bash
        run: |
          exe=build/bin/angelscript-demo
          [ "$RUNNER_OS" = Windows ] && exe=build/bin/angelscript-demo.exe
          "$exe" --wait --port 9002 > host.log 2>&1 &
          host=$!
          sleep 3
          node test-dap.mjs 9002 attach
          status=$?
          kill $host 2>/dev/null || true
          cat host.log
          exit $status
