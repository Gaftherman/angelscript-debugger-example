name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  zip:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: true
      - name: Build a clean source zip
        run: |
          name="angelscript-debugger-example-${GITHUB_REF_NAME}"
          mkdir -p "dist/$name"
          git archive HEAD | tar -x -C "dist/$name"
          git submodule foreach --quiet 'git archive --prefix="$sm_path/" HEAD | tar -x -C "$toplevel/dist/'"$name"'"'
          (cd dist && zip -qr "$name.zip" "$name")
          unzip -Z1 "dist/$name.zip" | grep -v '/external/angelscript/sdk/' | grep -E '\.(gif|png|mp4|log)$' && exit 1 || true
      - name: Release notes from the changelog
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v h="## [${version}]" 'index($0, h) == 1 {on=1; next} substr($0,1,3) == "## " || substr($0,1,1) == "[" {on=0} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "::error::CHANGELOG.md has no section for ${version}."; exit 1; }
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/*.zip --title "$GITHUB_REF_NAME" --notes-file notes.md
